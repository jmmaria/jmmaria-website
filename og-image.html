<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>OG image source — 1200×630</title>
<!-- Screenshot the .og box below at exactly 1200×630 and save as og-image.jpg -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body{ background:#555; margin:0; display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .og{ width:1200px; height:630px; background:var(--ink); color:var(--bone);
       padding:72px 80px; display:flex; flex-direction:column; justify-content:space-between; }
  .og__eyebrow{ font-family:var(--mono); font-size:15px; font-weight:500; text-transform:uppercase;
       letter-spacing:.28em; color:var(--stone-i); }
  .og__name{ font-family:var(--serif); font-size:124px; line-height:.94; letter-spacing:-.02em; margin:0; }
  .og__name em{ font-style:italic; }
  .og__tag{ font-family:var(--serif); font-size:34px; line-height:1.25; color:var(--stone-i); margin-top:22px; max-width:22ch; }
  .og__rule{ height:1px; background:var(--line-i); margin:0 0 26px; }
  .og__row{ display:flex; justify-content:space-between; align-items:flex-end; gap:40px; }
  .og__stats{ display:flex; gap:56px; }
  .og__n{ font-family:var(--serif); font-size:40px; line-height:1; display:block; font-variant-numeric:lining-nums tabular-nums; font-feature-settings:'lnum' 1,'onum' 0; }
  .og__l{ font-family:var(--mono); font-size:12px; text-transform:uppercase; letter-spacing:.2em;
       color:var(--stone-i); display:block; margin-top:8px; }
  .og__url{ font-family:var(--mono); font-size:14px; letter-spacing:.2em; text-transform:uppercase; color:var(--stone-i); }
</style>
</head>
<body>
<div class="og" id="og">
  <div>
    <p class="og__eyebrow">UGC creator &mdash; Dubai, filming worldwide</p>
    <p class="og__tag" style="margin-top:0;"></p>
  </div>
  <div>
    <h1 class="og__name">JM <em>Maria</em></h1>
    <p class="og__tag">Films that make people want to book the room.</p>
  </div>
  <div>
    <div class="og__rule"></div>
    <div class="og__row">
      <div class="og__stats">
        <div><span class="og__n">51K+</span><span class="og__l">Audience</span></div>
        <div><span class="og__n">10</span><span class="og__l">Properties</span></div>
        <div><span class="og__n">9</span><span class="og__l">Dubai venues</span></div>
        <div><span class="og__n">5</span><span class="og__l">Countries</span></div>
      </div>
      <span class="og__url">jmmaria.com</span>
    </div>
  </div>
</div>
</body>
</html>
