<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background: #fff; margin: 0; }
        .social-card { transition: all 0.35s cubic-bezier(0.4,0,0.2,1); }
        .social-card:hover { transform: translateY(-6px); }
    </style>
</head>
<body>

<div class="py-24 px-8 bg-white">
    <div class="max-w-7xl mx-auto mb-16 text-center">
        <span class="text-[10px] font-bold text-red-500 uppercase tracking-[0.4em] mb-3 block">04 Connect</span>

        <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mt-4">Follow along for daily travel content</p>
    </div>

    <div class="max-w-4xl mx-auto grid grid-cols-2 md:grid-cols-4 gap-5">

        <a href="https://instagram.com/itsjmmaria" target="_blank"
           class="social-card border-2 border-black rounded-[2.5rem] p-8 text-center group hover:bg-black transition-all">
            <i class="fab fa-instagram text-3xl mb-4 block text-pink-500 group-hover:text-pink-400"></i>
            <p class="font-black text-[9px] uppercase tracking-widest group-hover:text-white transition-colors">Instagram</p>
            <p class="text-slate-400 text-[9px] font-bold mt-1 group-hover:text-white/40 transition-colors">@itsjmmaria</p>
            <p class="text-xl font-black mt-2 group-hover:text-white transition-colors">10K+</p>
        </a>

        <a href="https://tiktok.com/@itsjmmaria" target="_blank"
           class="social-card border border-slate-100 rounded-[2.5rem] p-8 text-center group hover:bg-black hover:border-black transition-all">
            <i class="fab fa-tiktok text-3xl mb-4 block group-hover:text-white transition-colors"></i>
            <p class="font-black text-[9px] uppercase tracking-widest group-hover:text-white transition-colors">TikTok</p>
            <p class="text-slate-400 text-[9px] font-bold mt-1 group-hover:text-white/40 transition-colors">@itsjmmaria</p>
            <p class="text-xl font-black mt-2 group-hover:text-white transition-colors">15K+</p>
        </a>

        <a href="https://youtube.com/@jmmaria" target="_blank"
           class="social-card border border-slate-100 rounded-[2.5rem] p-8 text-center group hover:bg-black hover:border-black transition-all">
            <i class="fab fa-youtube text-3xl mb-4 block text-red-500 group-hover:text-red-400"></i>
            <p class="font-black text-[9px] uppercase tracking-widest group-hover:text-white transition-colors">YouTube</p>
            <p class="text-slate-400 text-[9px] font-bold mt-1 group-hover:text-white/40 transition-colors">@jmmaria</p>
            <p class="text-xl font-black mt-2 group-hover:text-white transition-colors">21K+</p>
        </a>

        <a href="https://facebook.com/janinamariac" target="_blank"
           class="social-card border border-slate-100 rounded-[2.5rem] p-8 text-center group hover:bg-black hover:border-black transition-all">
            <i class="fab fa-facebook text-3xl mb-4 block text-blue-600 group-hover:text-blue-400"></i>
            <p class="font-black text-[9px] uppercase tracking-widest group-hover:text-white transition-colors">Facebook</p>
            <p class="text-slate-400 text-[9px] font-bold mt-1 group-hover:text-white/40 transition-colors">janinamariac</p>
            <p class="text-xl font-black mt-2 group-hover:text-white transition-colors">5K+</p>
        </a>

    </div>

    <div class="max-w-4xl mx-auto mt-12 text-center">
        <p class="text-slate-300 text-[10px] font-bold uppercase tracking-[0.4em]">
            For collabs & inquiries → <a href="mailto:jmmaria.ugc@gmail.com" class="text-black border-b border-black hover:text-red-500 hover:border-red-500 transition-all">jmmaria.ugc@gmail.com</a>
        </p>
    </div>
</div>

</body>
</html>
